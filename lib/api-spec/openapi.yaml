openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: promo
    description: Promo code operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /promo/redeem:
    post:
      operationId: redeemPromoCode
      tags: [promo]
      summary: Redeem a promo code for Pro access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoRedeemRequest"
      responses:
        "200":
          description: Code redeemed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoRedeemResponse"
        "400":
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Code not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Already redeemed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PromoRedeemRequest:
      type: object
      required: [code, revenuecatId]
      properties:
        code:
          type: string
        revenuecatId:
          type: string
    PromoRedeemResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
