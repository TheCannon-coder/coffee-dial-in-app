  <rect width="1080" height="1080" fill="#2C1A0E"/>
  <circle cx="1010" cy="-40" r="300" fill="none" stroke="#3D2410" stroke-width="70"/>
  <circle cx="1010" cy="-40" r="210" fill="none" stroke="#3D2410" stroke-width="34"/>
  <text x="96" y="970" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="30" fill="#A89080">Coffee Brew Coach</text>
  <text x="984" y="970" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#A89080">coffeebrew.coach</text>
  <text x="96" y="200" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="4" fill="#C07A30">COLD BREW</text>
  <text x="96" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" fill="#FAF7F2">Weak and watery? Add</text>
<text x="96" y="355.12" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" fill="#FAF7F2">more coffee before you</text>
<text x="96" y="440.24" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" fill="#FAF7F2">steep longer.</text>
  <text x="96" y="565.36" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#A89080">Time can't put back what the grounds never</text>
<text x="96" y="622.36" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#A89080">had. Raise the dose first.</text>
