  <text x="96" y="525.04" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#A89080">A quarter came back for a third. We'd like</text>
<text x="96" y="582.04" font-family="Helvetica, Arial, sans-serif" font-size="38" fill="#A89080">that second number to be bigger.</text>
