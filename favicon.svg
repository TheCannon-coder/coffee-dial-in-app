<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#111"/>

  <!-- Steam left -->
  <path d="M10 11 C11 10 9 9 10 8 C11 7 9 6 10 5"
        stroke="white" stroke-width="1.4" stroke-linecap="round" fill="none"/>

  <!-- Steam right -->
  <path d="M16 11 C17 10 15 9 16 8 C17 7 15 6 16 5"
        stroke="white" stroke-width="1.4" stroke-linecap="round" fill="none"/>

  <!-- Cup rim -->
  <rect x="5" y="12" width="16" height="2" rx="1" fill="white"/>

  <!-- Cup body (trapezoid, wider at top) -->
  <path d="M5 14 H21 L19 25 H7 Z" fill="white"/>

  <!-- Handle -->
  <path d="M21 17 Q27 17 27 21 Q27 25 21 25"
        fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Saucer -->
  <rect x="4" y="26" width="21" height="1.5" rx="0.75" fill="white"/>
</svg>
